# CI for the Pyro workspace (project plan §13, Q33).
# Signed macOS releases live in release.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Flutter stable only (Q18). Bump together with the local toolchain and
  # update-goldens.yml (then refresh the goldens with it); Flutter
  # 3.44.x caps build_runner at 2.15.1 (Q76), which matters once the contract
  # job runs the generator.
  FLUTTER_VERSION: "3.47.7"
# Linux jobs pin ubuntu-24.04 rather than ubuntu-latest, which moves to
# Ubuntu 26 from 2026-10-19 (the desktop build's apt packages, e.g.
# libstdc++-12-dev, are named per release). macOS jobs pin macos-26 rather
# than macos-latest: the pyro_ui goldens are rendered on it, and fonts
# rasterise differently between macOS releases. Move deliberately, together
# with update-goldens.yml, and refresh the goldens with it in the same change.

jobs:
  analyze-test:
    name: Analyze and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Resolve the workspace
        run: dart pub get
      # The app's generated freezed files are committed; regenerating them
      # must change nothing (spec 002).
      - name: Check generated code
        if: runner.os == 'Linux'
        working-directory: apps/editor
        run: dart run build_runner build -d && git diff --exit-code -- lib
      # The generator's fixture game commits its Registry and Manifest;
      # regenerating them from a fresh checkout must change nothing, on every
      # OS (spec 003, SC-003).
      - name: Check the fixture game's generated files
        working-directory: packages/pyro_generator/fixture_game
        run: |
          dart run build_runner build -d
          git diff --exit-code -- lib/pyro.g.dart lib/pyro.manifest.json
      # The same for the example game, on every OS: this is the output that
      # could differ by system (spec 005, FR-009a).
      - name: Check the example game's generated files
        working-directory: example
        run: |
          dart run build_runner build -d
          git diff --exit-code -- lib/pyro.g.dart lib/pyro.manifest.json
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed packages apps example
      - name: Analyze pure-Dart packages
        run: dart analyze --fatal-infos packages/pyro_annotations packages/pyro_generator
      - name: Analyze Flutter packages and the app
        run: flutter analyze --fatal-infos packages/pyro_runtime packages/pyro_ui apps/editor packages/pyro_generator/fixture_game example
      # Excluded files are still analyzed when named; the root options exclude
      # **/*.g.dart, so the Registry is checked this way (SC-005).
      - name: Analyze the fixture game's Registry
        working-directory: packages/pyro_generator/fixture_game
        run: flutter analyze --fatal-infos lib/pyro.g.dart
      - name: Analyze the example game's Registry
        working-directory: example
        run: flutter analyze --fatal-infos lib/pyro.g.dart
      - name: Test pyro_annotations
        working-directory: packages/pyro_annotations
        run: dart test
      - name: Test pyro_generator
        working-directory: packages/pyro_generator
        run: dart test
      - name: Test the generator's fixture game
        working-directory: packages/pyro_generator/fixture_game
        run: flutter test
      - name: Test the example game
        working-directory: example
        run: flutter test
      - name: Test pyro_runtime
        working-directory: packages/pyro_runtime
        run: flutter test
      - name: Test pyro_ui
        working-directory: packages/pyro_ui
        run: flutter test
      # The gallery's smoke test everywhere; its goldens (tag `golden`) skip
      # themselves off macOS, where fonts rasterise differently (Q84).
      - name: Test the pyro_ui gallery
        working-directory: packages/pyro_ui/example
        run: flutter test
      # A failed golden writes its master, test and diff images to
      # test/failures/; keep them so the change can be seen without a rerun.
      - name: Upload golden failures
        if: failure() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: packages/pyro_ui/example/test/failures/
          if-no-files-found: ignore
      - name: Test the Pyro app
        working-directory: apps/editor
        run: flutter test

  build-studio:
    name: Build Pyro (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            platform: macos
          - os: windows-latest
            platform: windows
          - os: ubuntu-24.04
            platform: linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: Install Linux desktop build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Resolve the workspace
        run: dart pub get
      - name: Build (unsigned release)
        working-directory: apps/editor
        run: flutter build ${{ matrix.platform }} --release

  contract:
    # The contract test (#12, Q59; spec 005): the Generator's output for
    # example/ is committed and reviewed, and every example/ Scene loads with
    # the real Registry, with no error and no Runtime warning. Each check is
    # its own step, so a failure names it (FR-013).
    name: Contract test
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
        working-directory: example
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Resolve the workspace
        working-directory: .
        run: dart pub get
      - name: Generate the example game's Registry and Manifest
        run: dart run build_runner build -d
      # On Flutter >= 3.47 (build_runner >= 2.16) this can become
      #   dart run build_runner build --only-check
      # (project plan §7.3, Q76).
      - name: Check the committed Registry and Manifest
        run: git diff --exit-code -- lib/pyro.g.dart lib/pyro.manifest.json
      # A deliberate Manifest change updates the golden too, after review:
      #   cp lib/pyro.manifest.json test/goldens/pyro.manifest.json.golden
      - name: Check the Manifest against its golden
        run: diff -u test/goldens/pyro.manifest.json.golden lib/pyro.manifest.json
      - name: Load every example Scene with the real Registry
        run: flutter test test/contract/
      # The root options exclude **/*.g.dart; naming the Registry analyzes it.
      - name: Analyze the example game
        run: flutter analyze --fatal-infos . lib/pyro.g.dart
