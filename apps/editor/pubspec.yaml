name: pyro
description: "Pyro: a scene editor for the Flame game engine."
# The desktop app ships as binaries from GitHub Releases, never on pub.dev.
publish_to: none
version: 0.0.1+1

environment:
  sdk: ^3.12.0
  flutter: ">=3.44.0"

resolution: workspace

# Never depends on pyro_generator (project plan §5). freezed is for the
# Document model's values (spec 002); Riverpod is added for the providers of
# v0.1 work item 1. Versions are the newest that resolve on Flutter 3.44.2
# (spec 002, research R1). flame_tiled joins when the first code uses it.
dependencies:
  clock: ^1.1.2
  crypto: ^3.0.6
  fast_immutable_collections: ^12.0.0
  file: ^7.0.1
  flame: ">=1.36.0 <2.0.0"
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  freezed_annotation: ^3.1.0
  pyro_runtime: ^0.0.1
  pyro_ui: ^0.0.1
  riverpod_annotation: 4.0.3
  uuid: ^4.6.0
  # The asset re-point before each Scene Hot-swap calls the VM service
  # (spec 007, research R4); the benchmarks use it too. BSD-3.
  vm_service: ^15.4.0
  # Parses the open project's pubspec.yaml (asset folders) and pubspec.lock
  # (Runtime version) — the editor's only new dependency (spec 006, plan.md's
  # Constitution Check).
  yaml: ^3.1.4

dev_dependencies:
  build_runner: ^2.15.1
  fake_async: ^1.3.3
  flame_test: ^2.3.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  freezed: 3.2.6-dev.1
  riverpod_generator: 4.0.4

flutter:
  uses-material-design: true
