name: pyro_ui
description: >-
  The Pyro design system in Flutter: tokens, theme and the editor's
  widgets. Used only by the Pyro app.
version: 0.0.1
# Never published: it exists to keep Pyro's look apart from its state
# and logic (Q83), not to be reused.
publish_to: none
issue_tracker: https://github.com/salah-rashad/pyro/issues
repository: https://github.com/salah-rashad/pyro/tree/main/packages/pyro_ui

environment:
  sdk: ^3.12.0
  flutter: ">=3.47.0"

resolution: workspace

# Flutter only (Q83): no flame, no Runtime, no Riverpod, nothing from the app.
dependencies:
  flutter:
    sdk: flutter
  # Lucide, the design system's icon set, as an icon font. PrIcons maps the
  # icons the design system names onto it.
  lucide_icons_flutter: ^4.0.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

# Inter 4.1 and JetBrains Mono 2.304, the static .ttf files from their GitHub
# releases (the design system's .woff2 files don't load in Flutter). Both are
# SIL OFL 1.1; the licences sit next to the fonts.
flutter:
  fonts:
    - family: Inter
      fonts:
        - asset: fonts/Inter-Regular.ttf
          weight: 400
        - asset: fonts/Inter-Medium.ttf
          weight: 500
        - asset: fonts/Inter-SemiBold.ttf
          weight: 600
    - family: JetBrains Mono
      fonts:
        - asset: fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: fonts/JetBrainsMono-Medium.ttf
          weight: 500
