name: pyro_runtime
description: >-
  Loads Pyro scenes into a Flame game. Ships in your game and
  re-exports pyro_annotations.
version: 0.0.1
publish_to: none # Until the package names are cleared with the Flame maintainers (Q36).
issue_tracker: https://github.com/salah-rashad/pyro/issues
repository: https://github.com/salah-rashad/pyro/tree/main/packages/pyro_runtime

environment:
  sdk: ^3.12.0
  flutter: ">=3.47.0"

resolution: workspace

dependencies:
  # Floor 1.36 for onHotReload (Q66); latest stable minor until Flame 2.0,
  # which the Runtime moves to in one release (Q18, Q80).
  flame: ">=1.36.0 <2.0.0"
  flame_behaviors: ^1.4.0
  flutter:
    sdk: flutter
  pyro_annotations: ^0.0.1

dev_dependencies:
  flame_test: ^2.0.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
