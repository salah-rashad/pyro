name: fixture_game
description: >-
  A small Flame game with every Field type, which CI runs pyro_generator on
  and whose committed Registry and Manifest it checks (spec 003). Never
  released.
publish_to: none
version: 0.0.1

environment:
  sdk: ^3.12.0
  flutter: ">=3.47.0"

resolution: workspace

dependencies:
  flame: ">=1.36.0 <2.0.0"
  flame_behaviors: ^1.4.0
  flutter:
    sdk: flutter
  pyro_annotations: ^0.0.1
  pyro_runtime: ^0.0.1

# No build.yaml: pyro_generator applies itself to packages that depend on it
# (FR-027).
dev_dependencies:
  build_runner: ^2.15.1
  flame_test: ^2.0.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  pyro_generator: ^0.0.1

flutter:
  assets:
    - assets/anims/
    - assets/images/
    - assets/scenes/
